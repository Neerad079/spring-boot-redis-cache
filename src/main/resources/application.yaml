spring:
  application:
    name: test

  # MySQL datasource
  datasource:
    url: jdbc:mysql://localhost:3306/weatherdb
    username: 
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # Redis
  data:
    redis:
      host: localhost
      port: 6379

  # Seed data
  sql:
    init:
      mode: always
